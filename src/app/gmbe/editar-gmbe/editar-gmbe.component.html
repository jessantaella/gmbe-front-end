<div class="container-fluid texto margen-inferior" >
  <div class="accordion w-75 m-auto mt-3" id="accordionExample">
    <div class="accordion-item">
      <h2 class="accordion-header" id="headingOne">
        <button class="accordion-button custom-accordion-button collapsed" type="button" data-bs-toggle="collapse"
          data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
          Datos generales
        </button>
      </h2>
      <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne"
        data-bs-parent="#accordionExample">
        <div class="accordion-body">
          <form [formGroup]="generales">
            <div class="row">
              <div class="col-lg-6 col-12">
                <div class="col-12 mt-2">
                  <div class="row">
                    <label for="nombre" class="col-lg-4 col-form-label text-lg-end text-start texto">* Nombre:</label>
                    <div class="col-lg-8">
                      <input [ngbTooltip]="this.mostrarNombre" placement="bottom"  type="text" class="form-control" id="nombre"
                        formControlName="nombre" maxlength="200">
                    </div>
                  </div>
                </div>
                <div class="col-12 mt-2">
                  <div class="row">
                    <label for="objetivos" class="col-lg-4 col-form-label text-lg-end text-start texto">* Objetivos:</label>
                    <div class="col-lg-8">
                      <input type="text" [ngbTooltip]="this.mostrarObjetivos" placement="bottom"  class="form-control" id="objetivos"
                        formControlName="objetivo" maxlength="500">
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-lg-6 col-12">
                <div class="col-12 mt-2">
                  <div class="row">
                    <label for="resumen" class="col-lg-4 col-form-label text-lg-end text-start texto">* Resumen con
                      principales hallazgos:</label>
                    <div class="col-lg-8 d-flex">
                      <textarea formControlName="resumen" class="form-control" id="resumen"></textarea>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-lg-6 col-12">
                <div class="col-12 mt-2 d-flex flex-column flex-lg-row align-items-start">
                  <label for="icono" class="col-12 col-lg-4 col-form-label text-lg-end text-start movil texto">* Carga de
                    ícono MBE:</label>
                  <div class="d-flex flex-wrap align-items-center">
                    <div class="movil-imagen-padding-2 bd-highlight" *ngIf="imageUrl">
                      <img [src]="imageUrl" alt="icono" class="img-thumbnail imagen img-margin">
                    </div>
                    <div class="movil-padding-2 bd-highlight">
                      <div class="file-upload-wrapper">
                        <input type="file" class="file-upload-input" accept=".png, .jpg, .jpeg" (change)="onFileChange($event)">
                        <em class="fas fa-upload upload-icon"></em>
                      </div>
                    </div>
                    <div class="p-2 bd-highlight">
                      <fa-icon [icon]="faX" class="btnOtrasAcciones" (click)="borrarImagen()"></fa-icon>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingTwo">
          <button class="accordion-button custom-accordion-button" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo"  (click)="open('categoriaEditar')" >
            Marco conceptual
          </button>
        </h2>
        <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#accordionExample">
          <div class="accordion-body">
            <div class="container">
              <div class="row">
                <div class="col-lg-6 col-12">
                  <div class="modal-header">
                    <label class="modal-title w-100 text-center tituloModal">Editar categoría</label>
                  </div>
                  <div class="modal-body">
                    <form [formGroup]="editarCategoriaForm">
                      <div class="mb-3">
                        <div class="row my-2 align-items-center">
                          <label for="nombre" class="col-12 col-md-4 col-form-label text-md-end">Nombre categoría:</label>
                          <div class="col-12 col-md-8 mt-2">
                            <select class="form-select" formControlName="categoria" (change)="this.escucharSelectEditado($event)">
                              <option value="" disabled>Seleccione una opción</option>
                              <option [value]="categoria.idCatalogo" *ngFor="let categoria of arregloCategoriasEditado">
                                {{categoria.catalogo}}
                              </option>
                            </select>
                          </div>
                        </div>
              
                        <div class="row my-2 align-items-center">
                          <label for="descripcion" class="col-12 col-md-4 col-form-label text-md-end">Descripción:</label>
                          <div class="col-12 col-md-8">
                            <textarea type="text" class="form-control" id="descripcion" placeholder="Descripción" formControlName="descripcion"></textarea>
                          </div>
                        </div>
              
                        <div class="row my-2 align-items-center">
                          <label for="url" class="col-12 col-md-4 col-form-label text-md-end">Página de Interés:</label>
                          <div class="col-12 col-md-8">
                            <input type="url" id="url" class="form-control" placeholder="Página de Interés" formControlName="url" (input)="validaUrl(2)">
                            <span *ngIf="mostrarErrorUrlCategoria" class="text-danger">Ingresa una URL</span>
                          </div>
                        </div>
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer justify-content-center mb-3">
                    <button type="button" class="btn btn-sm btn-cancelar" (click)="this.cerrarModalCatalgo()">
                      <fa-icon [icon]="faRotateLeft"></fa-icon> Cancelar
                    </button>
                    <button type="button" class="btn btn-sm btn-guardar" (click)="editarCategoria()" [disabled]="!editarCategoriaForm.valid || mostrarErrorUrlCategoria">
                      <fa-icon [icon]="faFloppyDisk"></fa-icon> Guardar
                    </button>
                  </div>
                </div>
              
                <div class="col-lg-6 col-12">
                  <div class="modal-header">
                    <label class="modal-title w-100 text-center tituloModal">Editar sub-categoría</label>
                  </div>
                  <div class="modal-body">
                    <form [formGroup]="editarSubcategoriaForm">
                      <div class="mb-3">
                        <div class="row my-2 align-items-center">
                          <label for="categoria" class="col-12 col-md-4 col-form-label text-md-end">* Nombre categoría:</label>
                          <div class="col-12 col-md-8 mt-2">
                            <select class="form-select" formControlName="categoria" (change)="obtenerSubCategoriasEditado($event)">
                              <option value="" disabled>Seleccione una opción</option>
                              <option [value]="categoria.idCatalogo" *ngFor="let categoria of arregloCategoriasEditado">
                                {{categoria.catalogo}}
                              </option>
                            </select>
                          </div>
                        </div>
              
                        <div class="row my-2 align-items-center">
                          <label for="subCategoria" class="col-12 col-md-4 col-form-label text-md-end">* Nombre subcategoría:</label>
                          <div class="col-12 col-md-8">
                            <select class="form-select" formControlName="subCategoria" (change)="changeSubcategoria($event)">
                              <option value="" disabled>Seleccione una opción</option>
                              <option [value]="categoria.idCatalogo" *ngFor="let categoria of subCategoriasEditado">
                                {{categoria.catalogo}}
                              </option>
                            </select>
                          </div>
                        </div>
              
                        <div class="row my-2 align-items-center">
                          <label for="descripcionSub" class="col-12 col-md-4 col-form-label text-md-end">Descripción:</label>
                          <div class="col-12 col-md-8">
                            <textarea type="text" class="form-control" id="descripcionSub" placeholder="Descripción" formControlName="descripcion"></textarea>
                          </div>
                        </div>
              
                        <div class="row my-2 align-items-center">
                          <label for="urlSub" class="col-12 col-md-4 col-form-label text-md-end">Página de Interés:</label>
                          <div class="col-12 col-md-8">
                            <input type="url" id="urlSub" class="form-control" placeholder="Página de Interés" formControlName="url" (input)="validaUrl(4)">
                            <span *ngIf="mostrarErrorUrlSubcategoria" class="text-danger">Ingresa una URL</span>
                          </div>
                        </div>
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-sm btn-cancelar" (click)="this.cerrarModalSubCatalgo()">
                      <fa-icon [icon]="faRotateLeft"></fa-icon> Cancelar
                    </button>
                    <button type="button" class="btn btn-sm btn-guardar" (click)="editarSubcategoria()" [disabled]="!editarSubcategoriaForm.valid || mostrarErrorUrlSubcategoria || !this.habilitarSub">
                      <fa-icon [icon]="faFloppyDisk"></fa-icon> Guardar
                    </button>
                  </div>
                </div>
              </div>
          </div>
        </div>
      </div>
    </div>

  </div>
  <div class="container no-margin m-2 text-center">
    <button class="btn btn-sm btn-cancelar m-2" [routerLink]="['/gmbe']">
      <fa-icon [icon]="faRotateLeft"></fa-icon>
      Cancelar
    </button>
    <button class="btn btn-sm btn-guardar m-2" [disabled]="!validarGuardar()" (click)="guardar()">
      <fa-icon [icon]="faFloppyDisk"></fa-icon>
      Guardar
    </button>
  </div>
</div>
